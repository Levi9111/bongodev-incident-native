name: Deploy Incident Management to Ubuntu EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: incident-native-main
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install backend dependencies and verify syntax
        working-directory: backend
        run: |
          if [[ -f package-lock.json ]]; then npm ci; else npm install; fi
          npm run check
      - name: Install frontend dependencies and build
        working-directory: frontend
        run: |
          if [[ -f package-lock.json ]]; then npm ci; else npm install; fi
          npm run build

  deploy:
    name: Deploy on the Ubuntu EC2 self-hosted runner
    needs: build
    # Runs directly ON the EC2 instance: no SSH, no stored keys, no inbound port 22.
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Sync source into the app directory and run deploy-ubuntu.sh
        run: |
          set -euo pipefail
          APP_DIR="${{ vars.EC2_APP_DIR }}"
          APP_DIR="${APP_DIR:-$HOME/incident-management-ubuntu-ec2}"
          # backend/.env (DB password) lives only in APP_DIR and is never overwritten.
          mkdir -p "$APP_DIR"
          rsync -a --delete \
            --exclude '.git/' \
            --exclude 'node_modules/' \
            --exclude 'dist/' \
            --exclude 'backend/.env' \
            ./ "$APP_DIR/"
          cd "$APP_DIR"
          bash scripts/deploy-ubuntu.sh
